version: '3.8'

services:
  backend:
    build:
      context: ../backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: movie-recommendation-backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
      - ../data:/app/data
      - ../model:/app/model
      - ../cache:/app/cache
    environment:
      - DEBUG=true
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    env_file:
      - ../.env
    networks:
      - movie-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: movie-recommendation-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - movie-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped

networks:
  movie-network:
    driver: bridge

volumes:
  data:
  model:
  cache: