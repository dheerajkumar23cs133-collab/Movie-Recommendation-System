services:
  # Backend Service (FastAPI)
  - type: web
    name: movie-recommendation-backend
    runtime: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: MODEL_PATH
        value: ./model
      - key: CACHE_DIR
        value: ./cache
      - key: TMDB_API_KEY
        sync: false

  # Frontend Service (React)
  - type: web
    name: movie-recommendation-frontend
    runtime: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm install -g serve && serve -s dist -l $PORT
    envVars:
      - key: NODE_VERSION
        value: 18
      - key: VITE_API_BASE_URL
        value: https://movie-recommendation-backend-zlo0.onrender.com
